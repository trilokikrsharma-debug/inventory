      <stop offset="1" stop-color="#e9f0f8"/>
    </linearGradient>
    <linearGradient id="sidebar" x1="0" y1="34" x2="0" y2="586" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <filter id="shadow" x="-6%" y="-8%" width="112%" height="116%">
      <feDropShadow dx="0" dy="22" stdDeviation="23" flood-color="#132238" flood-opacity=".2"/>
    </filter>
  </defs>
  <rect width="980" height="620" rx="30" fill="#dfe8f3"/>
