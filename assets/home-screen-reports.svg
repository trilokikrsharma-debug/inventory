<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="title desc">
  <title id="title">TSA Legacy reports view</title>
  <desc id="desc">Reports dashboard with sales chart, stock report, customer dues and supplier dues.</desc>
  <rect width="760" height="480" rx="24" fill="#eef4fb"/>
  <rect x="32" y="30" width="696" height="420" rx="20" fill="#fff" stroke="#d5e1ee"/>
  <g font-family="Manrope, Inter, Arial, sans-serif">
    <text x="62" y="78" fill="#10263c" font-size="24" font-weight="850">Reports</text>
    <text x="62" y="106" fill="#587089" font-size="13" font-weight="650">Sales, purchases, stock and dues review</text>
    <g transform="translate(62 132)">
      <rect width="420" height="246" rx="18" fill="#f7fbff" stroke="#d5e1ee"/>
      <text x="22" y="36" fill="#10263c" font-size="17" font-weight="850">Sales Report</text>
      <text x="22" y="60" fill="#587089" font-size="12" font-weight="650">Monthly trend</text>
      <g transform="translate(38 86)" fill="#0f4c81">
        <rect x="0" y="72" width="34" height="88" rx="9"/>
        <rect x="58" y="42" width="34" height="118" rx="9"/>
        <rect x="116" y="58" width="34" height="102" rx="9"/>
        <rect x="174" y="18" width="34" height="142" rx="9"/>
        <rect x="232" y="36" width="34" height="124" rx="9"/>
        <rect x="290" y="0" width="34" height="160" rx="9"/>
      </g>
      <path d="M38 246h342" stroke="#d5e1ee"/>
    </g>
    <g transform="translate(506 132)">
      <rect width="178" height="72" rx="16" fill="#fff" stroke="#d5e1ee"/>
      <text x="18" y="31" fill="#10263c" font-size="14" font-weight="850">Customer Dues</text>
      <text x="18" y="55" fill="#0f4c81" font-size="17" font-weight="850">Rs 38,200</text>
      <rect y="88" width="178" height="72" rx="16" fill="#fff" stroke="#d5e1ee"/>
      <text x="18" y="119" fill="#10263c" font-size="14" font-weight="850">Supplier Dues</text>
      <text x="18" y="143" fill="#0f4c81" font-size="17" font-weight="850">Rs 42,300</text>
      <rect y="176" width="178" height="72" rx="16" fill="#fff" stroke="#d5e1ee"/>
      <text x="18" y="207" fill="#10263c" font-size="14" font-weight="850">Stock Report</text>
      <text x="18" y="231" fill="#d97706" font-size="17" font-weight="850">12 low items</text>
    </g>
  </g>
