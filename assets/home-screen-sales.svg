        <text x="132" y="32" fill="#10263c" font-size="13" font-weight="750">Nila Stores</text>
        <text x="274" y="32" fill="#10263c" font-size="13" font-weight="850">Rs 4,820</text>
        <text x="392" y="32" fill="#d97706" font-size="13" font-weight="850">Rs 2,000</text>
