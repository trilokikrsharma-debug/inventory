        <text x="132" y="32" fill="#10263c" font-size="13" font-weight="750">Om Traders</text>
        <text x="274" y="32" fill="#10263c" font-size="13" font-weight="850">Rs 12,450</text>
        <text x="392" y="32" fill="#198754" font-size="13" font-weight="850">Rs 12,450</text>
