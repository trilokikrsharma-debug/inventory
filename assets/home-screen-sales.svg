<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="title desc">
  <title id="title">TSA Legacy sales list view</title>
  <desc id="desc">Sales list with invoice filters, payment status and action buttons.</desc>
  <rect width="760" height="480" rx="24" fill="#eef4fb"/>
  <rect x="32" y="30" width="696" height="420" rx="20" fill="#fff" stroke="#d5e1ee"/>
