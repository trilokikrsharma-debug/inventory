name: Deploy to GCP Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: pdo_mysql, intl, mbstring, gd, dom
        tools: composer

    - name: Install Dependencies
      run: composer install --optimize-autoloader

    - name: Run Static Analysis
      run: composer lint

    - name: Run Code Hygiene Check
      run: composer cs

    - name: Run Unit Tests
      run: vendor/bin/phpunit --testsuite Unit --testdox

    - name: Build Assets
      run: php cli/build_assets.php

    - name: Prepare Production Vendor Tree
      run: composer install --no-dev --optimize-autoloader

    - name: Deploy to Deploy Server
      uses: easingthemes/ssh-deploy@main
      env:
        SSH_PRIVATE_KEY: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
        ARGS: "-rltgoDzvO"
        SOURCE: "./"
        REMOTE_HOST: "35.207.217.200"
        REMOTE_USER: "deployer"
        TARGET: "/var/www/tsalegacy"
